services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    image: gym-portal-jenkins:lts-jdk21
    container_name: gym-portal-jenkins
    restart: unless-stopped
    group_add:
      - "0" # Docker Desktop's mounted socket is group root in the Linux VM.
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ../..:/workspace:ro
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=true"
      # The host-mounted repository is read-only and owned by the host user.
      # Trust only this exact source directory for local Git checkouts.
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /workspace
      GIT_CONFIG_KEY_1: core.autocrlf
      GIT_CONFIG_VALUE_1: "true"
    networks:
      - gym-project-network

volumes:
  jenkins_home:
    name: gym-portal-jenkins-home

networks:
  gym-project-network:
    name: gym-project-network
    external: true
